[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/KangaZero/hello-world-pp"

[workspace.dependencies]
# Internal
hw-pp-core = { path = "crates/hw-pp-core", version = "0.1.0" }

# Normalize accents/diacritics etc for endonyms
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"      # This crate provides Grapheme Cluster, Word and Sentence boundaries according to unicode statndards

# Errors
anyhow = "1.0.104"
thiserror = "2.0.21"

# CLI
clap = { version = "4.6.7", features = ["derive"] }

# Output styling (same versions clap already pulls in)
anstream = "1.0.0"
anstyle = "1.0.14"

# Testing
assert_cmd = "2.2.2"
predicates = "3.1.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

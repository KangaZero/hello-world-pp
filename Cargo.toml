[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/KangaZero/hello-world-pp"

[workspace.dependencies]
# Internal
hw-pp-core = { path = "crates/hw-pp-core", version = "0.1.0" }

# Normalize accents/diacritics etc. for endonyms
unicode-normalization = "0.1.26"
# Grapheme-aware reversal (`reverse_str`)
unicode-segmentation = "1.13.3"

# Errors
anyhow = "1.0.104"
thiserror = "2.0.21"

# CLI
clap = { version = "4.6.7", features = ["derive"] }

# Output styling (same versions clap already pulls in; keep in sync with clap's)
anstream = "1.0.0"
anstyle = "1.0.14"

# Testing
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
# One codegen unit + fat LTO: whole-program inlining and dead-code removal (~19% smaller binary).
lto = "fat"
codegen-units = 1
# Debug symbols are useless in a shipped CLI.
strip = true
# Nothing catches unwinds, and `main` returns `anyhow::Result`, so errors never panic.
panic = "abort"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

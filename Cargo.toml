[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/KangaZero/hello-world-pp"

[workspace.dependencies]
# Internal
hw-pp-core = { path = "crates/hw-pp-core", version = "0.1.0" }

# Errors
anyhow = "1.0.104"
thiserror = "2.0.21"

# CLI
clap = { version = "4.6.7", features = ["derive"] }

# Testing
assert_cmd = "2.2.2"
predicates = "3.1.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Toolchain + components come from rust-toolchain.toml; also sets up rust-cache.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Format
        run: cargo fmt --all -- --check

      # Language files are only reached via `#[path]` in generated code, so `cargo fmt` skips them.
      - name: Format language files
        run: find crates/hw-pp-core/src/data/programming_languages crates/hw-pp-core/src/data/human_languages -name '*.rs' -exec rustfmt --check {} +

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # Broken intra-doc links and other rustdoc warnings fail the build.
      - name: Docs
        run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # RustSec advisories, licenses, banned/duplicate crates and sources; config in deny.toml.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run --locked --workspace --all-features --no-tests=warn

      # nextest does not run doctests.
      - name: Doctests
        run: cargo test --locked --workspace --all-features --doc

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # Caches /nix/store paths in the GitHub Actions cache, so the toolchain and crate
      # builds are not refetched every run. FlakeHub is off: it needs `id-token: write`.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      # Nix hooks (nixfmt, statix, deadnix) + package build with its `--version` check.
      # rustfmt/clippy run in the `lint` job instead.
      - name: Flake check
        run: nix flake check -L
